<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НСИ Классификатор</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>НСИ Классификатор должностей</h1>
            <p class="subtitle">Введите название должности и получите её эталон</p>
        </header>

        <div class="search-section">
            <form id="classifyForm">
                <input type="text" id="positionInput" 
                       placeholder="Например: врач-терапевт" 
                       autocomplete="off">
                <button type="submit">Найти эталон</button>
            </form>
            <div id="result" class="result hidden"></div>
        </div>

        <div class="stats-section" id="statsSection">
    <h2>Статистика</h2>
    <div class="stats">
    <div class="stat-card">
        <h3>Всего должностей</h3>
        <p id="totalPositions">—</p>
    </div>
    <div class="stat-card">
        <h3>С эталоном</h3>
        <p id="coveredPositions">—</p>
    </div>
    <div class="stat-card">
        <h3>Покрытие</h3>
        <p id="coveragePercent">—</p>
    </div>
</div>
</div>

        <div class="etalon-section">
            <h2>Эталонный справочник</h2>
            <div id="etalonList">
                <p class="loading">Загрузка эталонов...</p>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
